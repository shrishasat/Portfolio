<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shrisha Sathishkumar</title>

  <meta
    name="description"
    content="Shrisha Sathishkumar — neuroscience, neuroAI, brain-machine interfaces and computational research."
  >

  <link rel="stylesheet" href="css/style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <!-- 3D robot -->
  <canvas id="robotCanvas"></canvas>

  <!-- Navigation revealed by scrolling -->
  <nav id="nav" aria-label="Main navigation">

    <a href="about.html">ABOUT ME</a>
    <a href="blogs.html">BLOGS</a>
    <a href="projects.html">PROJECTS</a>
    <a href="contact.html">CONTACT</a>

  </nav>


  <!-- Live information -->
  <div id="telemetry">

    <div class="tele-line">
      <span>LOCAL TIME</span>
      <span id="localTime">--:--:--</span>
    </div>

    <div class="tele-line">
      <span>EARTH → SUN</span>
      <span>~149.6M KM</span>
    </div>

    <div class="tele-line">
      <span>EARTH → ANDROMEDA</span>
      <span>~2.54M LY</span>
    </div>

    <div class="tele-line">
      <span>EARTH ORBIT / TODAY</span>
      <span id="orbitToday">-- KM</span>
    </div>

    <div class="tele-line asteroid-line">
      <span>CLOSEST ASTEROID</span>
      <span id="asteroidDistance">SCANNING...</span>
    </div>

    <div class="tele-status">
      <span>ROBOT</span>
      <span>ONLINE</span>
    </div>

  </div>


  <main>

    <section class="hero" id="home">

      <!-- Identity -->
      <div id="identity">

        <p class="role">
          neuroAI · brain–machine interfaces
        </p>

        <h1>
          Shrisha Sathishkumar
        </h1>

        <p class="tagline">
          neuroscience × machine learning × curiosity
        </p>

      </div>


      <!-- Rotating philosophical/scientific phrases -->
      <div id="phrase" aria-live="polite"></div>


      <!-- Scroll indicator -->
      <div class="scroll-hint">
        SCROLL ↓
      </div>

    </section>


    <!--
      Invisible extra scroll space.
      This gives the browser enough page height for
      the navigation to reveal when scrolling.
    -->
    <div class="scroll-space"></div>

  </main>


  <script type="module" src="js/hero.js"></script>

</body>
</html>
